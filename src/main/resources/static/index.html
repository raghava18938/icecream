<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍦 Firefly Ice Cream Shop 🍦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        header h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            animation: popIn 0.6s ease-out forwards;
        }

        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.2s; }
        .product-card:nth-child(3) { animation-delay: 0.3s; }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .ice-cream-icon {
            font-size: 4em;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .product-info {
            padding: 25px;
        }

        .product-name {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .product-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .size-badge {
            background: #e0e7ff;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .price {
            font-size: 1.8em;
            color: #f5576c;
            font-weight: bold;
        }

        .availability {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            margin-top: 12px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .available {
            background: #d4edda;
            color: #155724;
        }

        .unavailable {
            background: #f8d7da;
            color: #721c24;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .available .status-dot {
            background: #28a745;
        }

        .unavailable .status-dot {
            background: #dc3545;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .error {
            text-align: center;
            color: #fff;
            background: rgba(0, 0, 0, 0.2);
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            font-size: 1.2em;
        }

        .error-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 40px;
        }

        .refresh-btn {
            background: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            color: #667eea;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .refresh-btn:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5em;
            }

            .products-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .product-details {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍦 Firefly Ice Cream Shop 🍦</h1>
            <p>Discover our delicious ice cream flavors</p>
        </header>

        <div id="products-container">
            <div class="loading">
                <div class="loading-spinner"></div>
                Loading our delicious ice creams...
            </div>
        </div>

        <footer>
            <p>Made with ❤️ for ice cream lovers</p>
        </footer>
    </div>

    <script>
        // Fetch and display products
        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const products = await response.json();
                displayProducts(products);
            } catch (error) {
                console.error('Error loading products:', error);
                displayError(error.message);
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('products-container');

            if (products.length === 0) {
                container.innerHTML = '<div class="error"><div class="error-icon">🤷</div><p>No products found</p></div>';
                return;
            }

            const productsHTML = products.map(product => `
                <div class="product-card">
                    <div class="ice-cream-icon">
                        ${product.available ? '🍦' : '❌'}
                    </div>
                    <div class="product-info">
                        <div class="product-name">${escapeHtml(product.name)}</div>

                        <div class="product-details">
                            <div class="size-badge">📏 ${escapeHtml(product.size)}</div>
                            <div class="price">$${product.price}</div>
                        </div>

                        <div class="availability">
                            <span class="status-badge ${product.available ? 'available' : 'unavailable'}">
                                <span class="status-dot"></span>
                                ${product.available ? 'Available' : 'Out of Stock'}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = productsHTML;
        }

        function displayError(errorMessage) {
            const container = document.getElementById('products-container');
            container.innerHTML = `
                <div class="error">
                    <div class="error-icon">😞</div>
                    <p>Oops! Failed to load products</p>
                    <p style="font-size: 0.9em; margin-top: 10px; opacity: 0.8;">${escapeHtml(errorMessage)}</p>
                    <button class="refresh-btn" onclick="loadProducts()">🔄 Try Again</button>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load products when page loads
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
